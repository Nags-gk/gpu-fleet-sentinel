name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with: {version: v2.1.6}
      - name: unit tests (race detector)
        run: go test -race -coverprofile=cover.out ./...
      - name: coverage
        run: go tool cover -func=cover.out | tail -1

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: controller + agents against a real kube-apiserver (envtest)
        run: make test-integration

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/gpu-fleet-sentinel
      - run: |
          helm template t deploy/helm/gpu-fleet-sentinel \
            --set serviceMonitor.enabled=true --set prometheusRule.enabled=true \
            --set controller.llm.baseURL=http://ollama:11434/v1 > /dev/null

  e2e:
    needs: [test, integration, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: sentinel
          config: deploy/kind/cluster.yaml
      - name: build and load image
        run: |
          docker build -t gpu-fleet-sentinel:ci .
          kind load docker-image gpu-fleet-sentinel:ci --name sentinel
      - name: install chart
        run: |
          helm install sentinel deploy/helm/gpu-fleet-sentinel -n gpu-sentinel --create-namespace \
            -f deploy/kind/values-kind.yaml \
            --set image.repository=gpu-fleet-sentinel --set image.tag=ci --wait --timeout 3m
      - name: run e2e
        run: ./hack/e2e.sh

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [e2e]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nags-gk/gpu-fleet-sentinel:${{ github.ref_name }}
