# Two pools with different risk tolerance. Fields left out inherit the
# controller's flag defaults (Helm: controller.* values).
apiVersion: gpu-sentinel.io/v1alpha1
kind: GPUNodePolicy
metadata:
  name: training-h100          # sorted first, so it wins if selectors overlap
spec:
  nodeSelector:
    matchLabels: {pool: training}
  gracePeriod: 1m
  recoveryPeriod: 15m
  maxUnavailable: 1            # a bad node stalls a whole training job: act fast, but one at a time
  maxUnavailablePercent: 5
---
apiVersion: gpu-sentinel.io/v1alpha1
kind: GPUNodePolicy
metadata:
  name: inference-canary
spec:
  nodeSelector:
    matchLabels: {pool: inference}
  dryRun: true                 # observe events and status before enforcing
  drainScope: all
---
# Automated repair: if a node is still unhealthy 15m after quarantine, ask for a
# reboot (up to 2 times, 20m apart, one node at a time), then ask for a
# replacement. See docs/ARCHITECTURE.md for the safety gates.
apiVersion: gpu-sentinel.io/v1alpha1
kind: GPUNodePolicy
metadata:
  name: training-h100-repair
spec:
  nodeSelector:
    matchLabels: {pool: training-repair}
  escalation:
    after: 15m
    maxAttempts: 2
    cooldown: 20m
    maxConcurrent: 1
